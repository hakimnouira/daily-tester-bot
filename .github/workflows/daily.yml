name: Daily Tester Bot

on:
  schedule:
    - cron: '0 9 * * *'   # 11:00 Tunisia time
  workflow_dispatch:
concurrency:
  group: daily-tester-bot
  cancel-in-progress: true
jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
